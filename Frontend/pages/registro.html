<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - Registro</title>
    <link rel="stylesheet" href="../css/estilosLogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <i class="fas fa-user-plus logo-icon"></i>
                <h1>Crear Cuenta</h1>
                <p>Completa tus datos para registrarte en el sistema</p>
            </div>

            <!-- Sin action ni method: el JS intercepta el submit -->
            <form id="register-form">
                <div class="input-group">
                    <label for="fullname">Nombre Completo</label>
                    <div class="input-wrapper">
                        <i class="fas fa-id-card"></i>
                        <input type="text" id="fullname" name="fullname" placeholder="Ej: Juan Pérez" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="new-user">Nombre de Usuario</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="new-user" name="new-user" placeholder="Ej: juan.perez" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="rol-registro">Rol en la empresa</label>
                    <div class="input-wrapper">
                        <i class="fas fa-briefcase"></i>
                        <select id="rol-registro" name="rol" required>
                            <option value="" disabled selected>Selecciona tu rol</option>
                            <option value="empleado">Empleado</option>
                            <option value="tecnico">Técnico</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="new-password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="new-password" name="new-password" placeholder="Mínimo 8 caracteres"
                            required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password">Confirmar Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="confirm-password" name="confirm-password"
                            placeholder="Repite tu contraseña" required>
                    </div>
                </div>

                <button type="submit" class="btn-login">Registrarse</button>
            </form>

            <div class="login-footer">
                <p>¿Ya tienes cuenta? <a href="../index.html" class="link-register">Inicia sesión aquí</a></p>
            </div>
        </section>
    </main>
    <script src="../js/main.js"></script>
</body>

</html>
