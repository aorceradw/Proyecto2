<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Incidencia</title>
    <link rel="stylesheet" href="../css/estilosDashboard.css">
    <link rel="stylesheet" href="../css/estilosincidencias.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="main-layout">

    <nav class="navbar">
        <div class="user-tag">
            <i class="fas fa-user-circle"></i>
            <span>Hola, <strong id="nombre-usuario">...</strong> (<span id="rol-usuario">...</span>)</span>
        </div>
        <a href="../index.html" class="exit-button">
            <i class="fas fa-sign-out-alt"></i> Salir
        </a>
    </nav>

    <main class="dashboard-container">
        <div class="dashboard-card">

            <header class="card-header detail-header">
                <div class="brand">
                    <a href="dashboard.html" class="back-link">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <div>
                        <h1>Detalle de Incidencia</h1>
                        <!-- El JS rellena el ID -->
                        <span class="incident-id" id="detalle-id">#...</span>
                    </div>
                </div>
                <button class="btn-change-state" id="btn-cambiar-estado">
                    <i class="fas fa-sync-alt"></i> Cambiar Estado
                </button>
            </header>

            <section class="incident-info">
                <div class="info-header">
                    <div class="info-title">
                        <!-- El JS rellena título y badges -->
                        <h2 id="detalle-titulo">Cargando...</h2>
                        <div class="info-badges">
                            <span class="prio-tag mid" id="detalle-prioridad-badge">—</span>
                            <span class="state-tag open" id="detalle-estado-badge">—</span>
                        </div>
                    </div>
                </div>

                <div class="incident-details-grid">
                    <div class="detail-field">
                        <label>REPORTADO POR</label>
                        <!-- id="incident-reporter" para que el JS lo encuentre -->
                        <p id="incident-reporter">—</p>
                    </div>
                    <div class="detail-field">
                        <label>PRIORIDAD</label>
                        <p id="incident-priority">—</p>
                    </div>
                    <div class="detail-field">
                        <label>ESTADO</label>
                        <p id="incident-state">—</p>
                    </div>
                    <div class="detail-field">
                        <label>ID</label>
                        <p id="incident-id-field">—</p>
                    </div>
                </div>

                <div class="incident-description">
                    <label>DESCRIPCIÓN</label>
                    <!-- El JS rellena la descripción -->
                    <p id="detalle-descripcion">Cargando descripción...</p>
                </div>
            </section>

            <!-- SECCIÓN DE COMENTARIOS (estática por ahora) -->
            <section class="comments-section">
                <h3 class="section-title">
                    <i class="fas fa-comments"></i> Registro de Comentarios
                </h3>

                <div class="comments-list" id="lista-comentarios">
                    <p style="color: #999; text-align: center; padding: 20px;">
                        No hay comentarios para esta incidencia.
                    </p>
                </div>

                <div class="add-comment">
                    <textarea id="nuevo-comentario" placeholder="Escribe un comentario..."></textarea>
                    <button class="btn-submit-comment" id="btn-comentario">
                        <i class="fas fa-paper-plane"></i> Agregar Comentario
                    </button>
                </div>
            </section>

        </div>
    </main>
    <script src="../js/main.js"></script>
</body>

</html>
