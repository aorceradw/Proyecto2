<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Incidencias</title>
    <link rel="stylesheet" href="../css/estilosDashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="main-layout">

    <nav class="navbar">
        <div class="user-tag">
            <i class="fas fa-user-circle"></i>
            <!-- El JS rellena el nombre y rol del usuario -->
            <span>Hola, <strong id="nombre-usuario">...</strong> (<span id="rol-usuario">...</span>)</span>
        </div>
        <a href="../index.html" class="exit-button">
            <i class="fas fa-sign-out-alt"></i> Salir
        </a>
    </nav>

    <main class="dashboard-container">
        <div class="dashboard-card">

            <!-- Estadísticas: el JS las rellena con datos reales de la API -->
            <section class="stats-grid">
                <div class="stat-item">
                    <span class="label">TOTAL</span>
                    <span class="value" id="stat-total">—</span>
                </div>
                <div class="stat-item">
                    <span class="label">ABIERTAS</span>
                    <span class="value color-open" id="stat-abiertas">—</span>
                </div>
                <div class="stat-item no-border">
                    <span class="label">PRIORIDAD ALTA</span>
                    <span class="value color-crit" id="stat-criticas">—</span>
                </div>
            </section>

            <header class="card-header">
                <div class="brand">
                    <i class="fas fa-th-large brand-icon"></i>
                    <h1>Panel de Incidencias</h1>
                </div>
                <a href="incidencias.html" class="btn-new" style="text-decoration: none;">
                    <i class="fas fa-plus"></i> Nueva Incidencia
                </a>
            </header>

            <div class="search-section">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Buscar por ID o título...">
                </div>
                <div class="status-select-wrapper">
                    <!-- Valores en minúscula para que coincidan con la BD -->
                    <select class="filter-select" id="filtro-estado">
                        <option value="">Todos los estados</option>
                        <option value="abierta">Abierta</option>
                        <option value="cerrada">Cerrada</option>
                    </select>
                </div>
                <div class="status-select-wrapper">
                    <select class="filter-select" id="filtro-prioridad">
                        <option value="">Todas las prioridades</option>
                        <option value="alta">Alta</option>
                        <option value="media">Media</option>
                        <option value="baja">Baja</option>
                    </select>
                </div>
            </div>

            <div class="table-wrapper">
                <table class="table-main">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>TÍTULO DE INCIDENCIA</th>
                            <th>PRIORIDAD</th>
                            <th>ESTADO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <!-- El JS rellena este tbody con datos reales -->
                    <tbody id="tabla-incidencias">
                        <tr>
                            <td colspan="5" style="text-align:center; padding:20px; color:#999;">
                                Cargando incidencias...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <footer class="card-footer">
                <!-- El JS actualiza este texto -->
                <p id="info-paginacion">Cargando...</p>
                <div class="pagination">
                    <button class="page-link">Anterior</button>
                    <button class="page-link active">1</button>
                    <button class="page-link">Siguiente</button>
                </div>
            </footer>

        </div>
    </main>
    <script src="../js/main.js"></script>
</body>

</html>
