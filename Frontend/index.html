<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soporte Técnico - Acceso</title>
    <link rel="stylesheet" href="css/estilosLogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <main class="login-container">
        <section class="login-card">
            <div class="login-header">
                <i class="fas fa-user-shield logo-icon"></i>
                <h1>Gestión de Incidencias</h1>
                <p>Bienvenido de nuevo, por favor inicia sesión</p>
            </div>

            <form id="login-form" action="pages/dashboard.html" method="GET">
                <div class="input-group">
                    <label for="usuario">Usuario</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="usuario" name="usuario" placeholder="Ej: admin123" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="rol">Rol en la empresa</label>
                    <div class="input-wrapper">
                        <i class="fas fa-briefcase"></i>
                        <select id="rol" name="rol" required>
                            <option value="" disabled selected>Selecciona tu rol</option>
                            <option value="empleado">Empleado</option>
                            <option value="tecnico">Técnico</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="btn-login">Entrar al Sistema</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="pages/registro.html" class="link-register">Regístrate aquí</a></p>
            </div>
        </section>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
